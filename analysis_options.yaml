analyzer:
  # Symlinks back into lib/leetcode/, grouped by topic. Analysing them would
  # report every solution twice.
  exclude:
    - lib/leetcode-mapping/**
  errors:
    constant_identifier_names: ignore
    curly_braces_in_flow_control_structures: ignore
include: package:lints/recommended.yaml

linter:
  rules:
    # Algorithm code reads better with snake_case for the counter/index arrays
    # it carries (t_counters, s_take, start_window) than with lowerCamelCase.
    # Off by choice, so that `dart analyze` reporting nothing means something.
    non_constant_identifier_names: false
